name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The release gate builds every candidate archive once, validates those exact
# files on a matching native runner, and publishes the same bytes. No
# validation job may rebuild its candidate: a rebuilt binary is a different
# artifact from the one that was tested.

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Resolve tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'tag must look like v0.1.0, got %s\n' "${tag}" >&2
            exit 1
          fi

          printf 'tag=%s\n' "${tag}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${tag#v}" >> "${GITHUB_OUTPUT}"

  test:
    name: Verify tests
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Check the installed Bun is the declared one
        run: |
          declared="$(bun -e 'const pkg = await Bun.file("package.json").json(); process.stdout.write(pkg.packageManager.replace(/^bun@/, ""));')"
          installed="$(bun --version)"
          if [ "${installed}" != "${declared}" ]; then
            printf 'bun %s is installed, package.json declares %s\n' "${installed}" "${declared}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Run smoke tests
        run: make smoke

  package:
    name: Build release candidates
    needs: [resolve, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # This job compiles the bytes that ship, so the compiler it uses is part
      # of the release.
      - name: Check the installed Bun is the declared one
        run: |
          declared="$(bun -e 'const pkg = await Bun.file("package.json").json(); process.stdout.write(pkg.packageManager.replace(/^bun@/, ""));')"
          installed="$(bun --version)"
          if [ "${installed}" != "${declared}" ]; then
            printf 'bun %s is installed, package.json declares %s\n' "${installed}" "${declared}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check package version matches tag
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          package_version="$(bun -e 'const pkg = await Bun.file("package.json").json(); process.stdout.write(pkg.version);')"
          test "${package_version}" = "${VERSION}"

      - name: Resolve release notes
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          notes_file="docs/release-notes/release-notes-${VERSION}.md"

          if [ ! -f "${notes_file}" ]; then
            printf 'missing release notes: %s\n' "${notes_file}" >&2
            exit 1
          fi

      - name: Build every candidate archive and its checksum manifest
        run: scripts/package-homebrew-artifacts.sh
        env:
          VERSION: ${{ needs.resolve.outputs.version }}

      - name: Upload the candidates
        uses: actions/upload-artifact@v4
        with:
          name: release-candidates
          path: |
            dist/homebrew/capshelf-${{ needs.resolve.outputs.version }}-*.tar.gz
            dist/homebrew/capshelf-${{ needs.resolve.outputs.version }}.sha256
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Validate ${{ matrix.platform }} on ${{ matrix.os }}
    needs: [resolve, package]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: darwin-arm64
          # linux-arm64 and darwin-x64 need `ubuntu-24.04-arm` and
          # `macos-15-intel`. Both labels exist in GitHub's standard-runner
          # table, but this repository's eligibility for them has not been
          # confirmed, so enabling them here would fail the release rather
          # than validate it. Confirm eligibility, then add:
          #   - os: ubuntu-24.04-arm
          #     platform: linux-arm64
          #   - os: macos-15-intel
          #     platform: darwin-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download the candidates
        uses: actions/download-artifact@v4
        with:
          name: release-candidates
          path: candidates

      - name: Verify this platform's checksum and extract it
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd candidates
          archive="capshelf-${VERSION}-${PLATFORM}.tar.gz"
          grep -E "  ${archive}\$" "capshelf-${VERSION}.sha256" > this.sha256
          test -s this.sha256
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 -c this.sha256
          else
            sha256sum -c this.sha256
          fi
          tar -xzf "${archive}"
          chmod +x capshelf

      - name: Report the versions this validation ran against
        run: |
          git --version
          ./candidates/capshelf --version

      - name: Check the candidate reports the release version
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: test "$(./candidates/capshelf --version)" = "${VERSION}"

      # The extracted candidate is the executable under test. `e2e:run` never
      # builds, so this job cannot substitute a different binary.
      - name: Run end-to-end scenarios against the extracted candidate
        env:
          CAPSHELF_E2E_BIN: ${{ github.workspace }}/candidates/capshelf
        run: bun run e2e:run

  publish:
    name: Publish validated candidates
    needs: [resolve, package, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Download the validated candidates
        uses: actions/download-artifact@v4
        with:
          name: release-candidates
          path: candidates

      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          notes_file="docs/release-notes/release-notes-${VERSION}.md"
          test -f "${notes_file}"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --notes-file "${notes_file}"
            gh release upload "${TAG}" \
              "candidates/capshelf-${VERSION}-"*.tar.gz \
              "candidates/capshelf-${VERSION}.sha256" \
              --clobber
          else
            gh release create "${TAG}" \
              "candidates/capshelf-${VERSION}-"*.tar.gz \
              "candidates/capshelf-${VERSION}.sha256" \
              --verify-tag \
              --notes-file "${notes_file}"
          fi
