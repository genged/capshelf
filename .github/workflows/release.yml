name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_run:
    workflows: [Test]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  discover:
    name: Find release tags
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.repository.full_name == github.repository &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.release.outputs.targets }}
    steps:
      - name: Check out the gate scripts
        uses: actions/checkout@v4
      - name: Resolve release requests
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/resolve-release-request.sh

  release:
    name: Release ${{ matrix.tag }}
    needs: discover
    if: needs.discover.outputs.targets != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.targets) }}
    concurrency:
      group: release-${{ matrix.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-lane.yml
    with:
      tag: ${{ matrix.tag }}
      sha: ${{ matrix.sha }}
