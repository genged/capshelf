name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A pull request groups by ref, so a new push supersedes the run still going:
# only the newest state matters there.
#
# A push groups by commit, which means it shares a group with nothing and is
# never superseded. Grouping pushes by ref would not be enough — a queued run
# is cancelled when a newer one joins its group, so rapid pushes to `main`
# would keep the first and the last and discard every commit between them.
# Work lands on `main` directly, and a commit with no verdict is a commit a
# release tag can point at.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and format (Biome)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.4.16

      - name: Run Biome
        run: biome ci .

  test:
    name: Test
    uses: ./.github/workflows/test-lane.yml
