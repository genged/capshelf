name: Bun canary

# The declared Bun version builds and tests every release. This canary runs the
# same lane against the newest Bun, so an incompatibility appears on a schedule
# instead of during a release.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Newest Bun
    uses: ./.github/workflows/test-lane.yml
    with:
      bun-version: latest
