name: Bun canary

# The pinned Bun version is what builds and tests every release. This canary
# runs the same checks against the newest Bun so an incompatibility is found
# on a schedule instead of during a release. It builds a host binary only:
# release candidates are built by the release workflow, at the pinned version.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Newest Bun
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up the newest Bun
        uses: oven-sh/setup-bun@v2
        with:
          # bun-pin: intentionally-latest
          bun-version: latest

      - name: Report the versions under test
        run: |
          bun --version
          git --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Run smoke tests
        run: make smoke

      - name: Build a host binary
        run: bun run build

      - name: Run end-to-end scenarios against the compiled binary
        env:
          CAPSHELF_E2E_BIN: ${{ github.workspace }}/dist/capshelf
        run: bun run e2e:run
